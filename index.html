<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماتش لايف | MatchLive</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 select-none">

  <!-- Header -->
  <header class="bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 shadow-xl">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m4.93 4.93 4.24 4.24"></path>
              <path d="m14.83 9.17 4.24-4.24"></path>
              <path d="m14.83 14.83 4.24 4.24"></path>
              <path d="m9.17 14.83-4.24 4.24"></path>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-200 to-white bg-clip-text text-transparent">ماتش لايف</h1>
            <span class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold px-1.5 py-0.5 rounded">LIVE</span>
          </div>
          <p id="status-subtext" class="text-[10px] text-slate-400">مباريات اليوم الحقيقية</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="install-header-btn" onclick="installAppPrompt()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl shadow-md shadow-emerald-600/20 flex items-center gap-1.5 transition">
          <span>📲</span> <span>تثبيت</span>
        </button>

        <button onclick="loadMatches()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60" title="تحديث">
          <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Choix des jours -->
    <div class="max-w-3xl mx-auto px-4 pb-2 pt-1 flex items-center justify-between gap-2 text-xs font-bold border-t border-slate-800/60">
      <button onclick="changeDay('yesterday')" id="btn-yesterday" class="flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800">الأمس</button>
      <button onclick="changeDay('today')" id="btn-today" class="flex-1 py-1.5 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-500">اليوم</button>
      <button onclick="changeDay('tomorrow')" id="btn-tomorrow" class="flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800">الغد</button>
    </div>
  </header>

  <!-- Matches Box -->
  <main id="matches-box" class="max-w-3xl mx-auto px-4 mt-4 space-y-4">
    <div class="text-center py-16 text-emerald-400 font-bold text-xs flex flex-col items-center gap-2">
      <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <span>جاري الاتصال بقاعدة البيانات الرياضية... ⚽</span>
    </div>
  </main>

  <script>
    const API_TOKEN = "65b4b137b7d84535b40b50ce22d9e2c5";
    let selectedDay = "today";

    function getDateQuery(dayType) {
      const now = new Date();
      if (dayType === "yesterday") now.setDate(now.getDate() - 1);
      if (dayType === "tomorrow") now.setDate(now.getDate() + 1);
      return now.toISOString().split("T")[0];
    }

    function changeDay(day) {
      selectedDay = day;
      ["yesterday", "today", "tomorrow"].forEach(d => {
        const btn = document.getElementById("btn-" + d);
        if (d === day) {
          btn.className = "flex-1 py-1.5 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-500 font-bold";
        } else {
          btn.className = "flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800 font-bold";
        }
      });
      loadMatches();
    }

    async function loadMatches() {
      const box = document.getElementById("matches-box");
      const icon = document.getElementById("refresh-icon");
      if (icon) icon.classList.add("animate-spin");

      box.innerHTML = `
        <div class="text-center py-16 text-emerald-400 font-bold text-xs flex flex-col items-center gap-2">
          <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
          <span>جاري تحميل مباريات ${selectedDay === 'today' ? 'اليوم' : (selectedDay === 'yesterday' ? 'الأمس' : 'الغد')} الحية... ⚽</span>
        </div>
      `;

      const targetDate = getDateQuery(selectedDay);
      const apiUrl = `https://api.football-data.org/v4/matches?dateFrom=${targetDate}&dateTo=${targetDate}`;

      // Proxies avec contournement CORS pour GitHub Pages
      const proxyList = [
        `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(apiUrl)}`
      ];

      let fetchedData = null;

      for (let pUrl of proxyList) {
        try {
          const res = await fetch(pUrl, {
            headers: { "X-Auth-Token": API_TOKEN }
          });
          if (res.ok) {
            fetchedData = await res.json();
            if (fetchedData && fetchedData.matches) break;
          }
        } catch (e) {
          console.warn("Proxy attempt failed, trying next...");
        }
      }

      if (icon) icon.classList.remove("animate-spin");

      if (fetchedData && fetchedData.matches && fetchedData.matches.length > 0) {
        displayRealMatches(fetchedData.matches);
      } else {
        box.innerHTML = `
          <div class="text-center py-14 bg-slate-900 rounded-3xl border border-slate-800 p-4">
            <span class="text-3xl block mb-2">⚽</span>
            <p class="text-slate-300 font-bold text-xs mb-1">لا توجد مباريات مدرجة لهذا اليوم في الدوريات الكبرى</p>
            <p class="text-slate-500 text-[11px]">التاريخ: ${targetDate}</p>
          </div>
        `;
      }
    }

    function displayRealMatches(matches) {
      const box = document.getElementById("matches-box");
      box.innerHTML = "";

      const leagues = {};
      matches.forEach(m => {
        const comp = m.competition ? m.competition.name : "بطولة غير مصنفة";
        const emblem = m.competition && m.competition.emblem ? m.competition.emblem : "";
        if (!leagues[comp]) leagues[comp] = { name: comp, emblem: emblem, list: [] };
        leagues[comp].list.push(m);
      });

      Object.values(leagues).forEach(grp => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 rounded-3xl p-4 border border-slate-800/80 shadow-md space-y-2.5";

        let rows = "";
        grp.list.forEach(m => {
          const home = m.homeTeam ? m.homeTeam.name : "الفريق 1";
          const away = m.awayTeam ? m.awayTeam.name : "الفريق 2";
          const hCrest = m.homeTeam && m.homeTeam.crest ? m.homeTeam.crest : "";
          const aCrest = m.awayTeam && m.awayTeam.crest ? m.awayTeam.crest : "";

          let timeStr = "--:--";
          if (m.utcDate) {
            const d = new Date(m.utcDate);
            timeStr = d.toLocaleTimeString("ar-MA", { hour: "2-digit", minute: "2-digit", hour12: false });
          }

          let scoreStr = "- : -";
          let badge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[11px] font-bold px-2 py-0.5 rounded-xl font-mono">${timeStr}</span>`;

          if (m.status === "IN_PLAY" || m.status === "PAUSED") {
            const h = m.score && m.score.fullTime && m.score.fullTime.home !== null ? m.score.fullTime.home : 0;
            const a = m.score && m.score.fullTime && m.score.fullTime.away !== null ? m.score.fullTime.away : 0;
            scoreStr = `${h} - ${a}`;
            badge = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-extrabold px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>مباشر</span>`;
          } else if (m.status === "FINISHED") {
            const h = m.score && m.score.fullTime && m.score.fullTime.home !== null ? m.score.fullTime.home : 0;
            const a = m.score && m.score.fullTime && m.score.fullTime.away !== null ? m.score.fullTime.away : 0;
            scoreStr = `${h} - ${a}`;
            badge = `<span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2 py-0.5 rounded-full">انتهت</span>`;
          }

          rows += `
            <div class="bg-slate-950/70 hover:bg-slate-800/60 p-3 rounded-2xl border border-slate-800/60 transition flex items-center justify-between">
              <div class="flex-1 text-right flex items-center gap-2 justify-start truncate">
                ${hCrest ? `<img src="${hCrest}" class="w-5 h-5 object-contain shrink-0" onerror="this.remove()">` : ''}
                <span class="font-bold text-xs sm:text-sm text-slate-200 truncate">${home}</span>
              </div>
              <div class="px-3 flex flex-col items-center min-w-[85px]">
                <span class="text-base font-extrabold font-mono tracking-wider text-white">${scoreStr}</span>
                ${badge}
              </div>
              <div class="flex-1 text-left flex items-center gap-2 justify-end truncate">
                <span class="font-bold text-xs sm:text-sm text-slate-200 truncate">${away}</span>
                ${aCrest ? `<img src="${aCrest}" class="w-5 h-5 object-contain shrink-0" onerror="this.remove()">` : ''}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-800/80 pb-2 mb-2">
            <h3 class="text-xs sm:text-sm font-bold text-emerald-400 flex items-center gap-2">
              ${grp.emblem ? `<img src="${grp.emblem}" class="w-4 h-4 object-contain" onerror="this.remove()">` : '🏆'}
              <span>${grp.name}</span>
            </h3>
            <span class="text-[10px] text-slate-400 font-medium">${grp.list.length} مباريات</span>
          </div>
          <div class="space-y-2">${rows}</div>
        `;
        box.appendChild(card);
      });
    }

    function installAppPrompt() {
      alert("لتثبيت التطبيق على هاتفك:\nاضغط على خيارات المتصفح (⋮) ثم اختر 'إضافة إلى الشاشة الرئيسية' (Add to Home screen).");
    }

    // Exécution
    loadMatches();
  </script>
</body>
</html>
