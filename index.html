<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماتش لايف | MatchLive</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 select-none">

  <!-- شريط العنوان -->
  <header class="bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 shadow-xl">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m4.93 4.93 4.24 4.24"></path>
              <path d="m14.83 9.17 4.24-4.24"></path>
              <path d="m14.83 14.83 4.24 4.24"></path>
              <path d="m9.17 14.83-4.24 4.24"></path>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-200 to-white bg-clip-text text-transparent">ماتش لايف</h1>
            <span class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold px-1.5 py-0.5 rounded">LIVE</span>
          </div>
          <p id="live-indicator-text" class="text-[10px] text-slate-400">مباريات رسمية مباشرة</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="install-header-btn" onclick="installAppPrompt()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl shadow-md shadow-emerald-600/20 flex items-center gap-1.5 transition">
          <span>📲</span> <span>تثبيت</span>
        </button>

        <button onclick="fetchMatchesForSelectedDay()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60" title="تحديث المباريات">
          <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- اختيار الأيام -->
    <div class="max-w-3xl mx-auto px-4 pb-2 pt-1 flex items-center justify-between gap-2 text-xs font-bold border-t border-slate-800/60">
      <button onclick="selectDay('yesterday')" id="day-btn-yesterday" class="flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800">الأمس</button>
      <button onclick="selectDay('today')" id="day-btn-today" class="flex-1 py-1.5 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-500">اليوم</button>
      <button onclick="selectDay('tomorrow')" id="day-btn-tomorrow" class="flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800">الغد</button>
    </div>
  </header>

  <!-- بنر التثبيت -->
  <div id="install-banner" class="max-w-3xl mx-auto px-4 mt-3 hidden">
    <div class="bg-gradient-to-r from-emerald-950 via-slate-900 to-teal-950 border border-emerald-500/30 p-3 rounded-2xl flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">📱</span>
        <div>
          <h4 class="text-xs font-bold text-white">تثبيت تطبيق ماتش لايف</h4>
          <p class="text-[10px] text-emerald-300">لمتابعة المباريات ونتائج اليوم بسرعة</p>
        </div>
      </div>
      <button onclick="installAppPrompt()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-xl shadow transition">
        تثبيت الآن
      </button>
    </div>
  </div>

  <!-- مكان عرض المباريات -->
  <main id="matches-container" class="max-w-3xl mx-auto px-4 mt-4 space-y-4">
    <div class="text-center py-16 text-emerald-400 font-bold text-xs flex flex-col items-center gap-2">
      <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <span>جاري الاتصال والتحقق من مباريات اليوم الرسمية... ⚽</span>
    </div>
  </main>

  <script>
    const API_KEY = "65b4b137b7d84535b40b50ce22d9e2c5";
    let activeDay = "today";

    function getDateStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split("T")[0];
    }

    function selectDay(day) {
      activeDay = day;
      const days = ["yesterday", "today", "tomorrow"];
      days.forEach(d => {
        const btn = document.getElementById("day-btn-" + d);
        if (btn) {
          if (d === day) {
            btn.className = "flex-1 py-1.5 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-500 font-bold";
          } else {
            btn.className = "flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800 font-bold";
          }
        }
      });
      fetchMatchesForSelectedDay();
    }

    async function fetchMatchesForSelectedDay() {
      const container = document.getElementById("matches-container");
      const refreshIcon = document.getElementById("refresh-icon");
      if (refreshIcon) refreshIcon.classList.add("animate-spin");

      container.innerHTML = `
        <div class="text-center py-16 text-emerald-400 font-bold text-xs flex flex-col items-center gap-2">
          <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
          <span>جاري جلب المباريات الحية... ⚽</span>
        </div>
      `;

      let targetDate = getDateStr(0);
      if (activeDay === "yesterday") targetDate = getDateStr(-1);
      if (activeDay === "tomorrow") targetDate = getDateStr(1);

      const targetUrl = `https://api.football-data.org/v4/matches?dateFrom=${targetDate}&dateTo=${targetDate}`;
