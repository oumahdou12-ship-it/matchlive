      <button onclick="filterLeague('maroc')" class="league-filter-btn shrink-0 px-3 py-1 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white" data-filter="maroc">🇲🇦 المغرب</button>

  <!-- Conteneur des matchs -->

      { rank: 6, team: "المغرب الفاسي", played: 24, diff: "+1", points: 34 }
    ];

    function renderMatches() {
      var container = document.getElementById('matches-container');
      if (!container) return;
      container.innerHTML = '';

      var dayLeagues = matchesDatabase[activeDay] || [];
      var filteredLeagues = dayLeagues;

      if (activeLeagueFilter !== 'all') {
        filteredLeagues = dayLeagues.filter(function(item) {
          return item.idTag === activeLeagueFilter;
        });
      }

      if (filteredLeagues.length === 0) {
        container.innerHTML = '<div class="text-center py-16 bg-slate-900 rounded-3xl border border-slate-800"><span class="text-4xl block mb-2">⚽</span><p class="text-slate-400 text-xs">لا توجد مباريات مسجلة لهذا الدوري في هذا اليوم</p></div>';
        return;
      }

      filteredLeagues.forEach(function(leagueItem) {
        var card = document.createElement('div');
        card.className = "bg-slate-900 rounded-3xl p-4 border border-slate-800/80 shadow-md space-y-2.5";

        var innerHTML = '<div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5 mb-2">' +
          '<h3 class="text-xs sm:text-sm font-bold text-emerald-400 flex items-center gap-2"><span>' + leagueItem.country + '</span> ' + leagueItem.league + '</h3>' +
          '<span class="text-[10px] text-slate-400 font-medium">' + leagueItem.matches.length + ' مباريات</span>' +
        '</div><div class="space-y-2">';

        leagueItem.matches.forEach(function(m) {
          var statusBadge = '';
          if (m.status === 'live') {
            statusBadge = '<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-extrabold px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>' + m.time + '</span>';
          } else if (m.status === 'finished') {
            statusBadge = '<span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2 py-0.5 rounded-full">انتهت</span>';
          } else {
            statusBadge = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[11px] font-bold px-2 py-0.5 rounded-xl font-mono">' + m.time + '</span>';
          }

          innerHTML += '<div onclick="openMatchDetails(' + m.id + ')" class="bg-slate-950/70 hover:bg-slate-800/60 p-3 rounded-2xl border border-slate-800/60 cursor-pointer transition flex items-center justify-between">' +
            '<div class="flex-1 text-right"><span class="font-bold text-xs sm:text-sm text-slate-200">' + m.home + '</span></div>' +
            '<div class="px-3 flex flex-col items-center min-w-[90px]"><span class="text-base font-extrabold font-mono tracking-wider text-white">' + m.score + '</span>' + statusBadge + '</div>' +
            '<div class="flex-1 text-left"><span class="font-bold text-xs sm:text-sm text-slate-200">' + m.away + '</span></div>' +
          '</div>';
        });

        innerHTML += '</div>';
        card.innerHTML = innerHTML;
        container.appendChild(card);
      });
    }

    function filterLeague(filterKey) {
      activeLeagueFilter = filterKey;
      var buttons = document.querySelectorAll('.league-filter-btn');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        if (btn.getAttribute('data-filter') === filterKey) {
          btn.className = "league-filter-btn shrink-0 px-3 py-1 rounded-xl bg-emerald-600 text-white border border-emerald-500";
        } else {
          btn.className = "league-filter-btn shrink-0 px-3 py-1 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white";
        }
      }
      renderMatches();
    }

    function selectDay(day) {
      activeDay = day;
      var days = ['yesterday', 'today', 'tomorrow'];
      for (var i = 0; i < days.length; i++) {
        var d = days[i];
        var btn = document.getElementById('day-btn-' + d);
        if (btn) {
          if (d === day) {
            btn.className = "flex-1 py-1.5 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-500 font-bold";
          } else {
            btn.className = "flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white bg-slate-900 border border-slate-800 font-bold";
          }
        }
      }
      renderMatches();
    }

    function renderStandings() {
      var tbody = document.getElementById('standings-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';
      standingsData.forEach(function(row) {
        var tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 transition";
        tr.innerHTML = '<td class="py-2.5 font-bold ' + (row.rank <= 2 ? 'text-emerald-400' : 'text-slate-400') + '">' + row.rank + '</td>' +
          '<td class="font-bold text-slate-200">' + row.team + '</td>' +
          '<td class="text-center text-slate-400">' + row.played + '</td>' +
          '<td class="text-center text-slate-400 font-mono">' + row.diff + '</td>' +
          '<td class="text-center font-bold text-emerald-400 font-mono">' + row.points + '</td>';
        tbody.appendChild(tr);
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      var matchesCont = document.getElementById('matches-container');
      var standingsCont = document.getElementById('standings-container');
      var banner = document.getElementById('install-banner');
      var matchBtn = document.getElementById('tab-matches-btn');
      var standingsBtn = document.getElementById('tab-standings-btn');

      if (tab === 'matches') {
        matchesCont.classList.remove('hidden');
        if (banner) banner.classList.remove('hidden');
        standingsCont.classList.add('hidden');
        matchBtn.className = "flex flex-col items-center gap-1 text-emerald-400 font-bold transition";
        standingsBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition";
      } else {
        matchesCont.classList.add('hidden');
        if (banner) banner.classList.add('hidden');
        standingsCont.classList.remove('hidden');
        matchBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition";
        standingsBtn.className = "flex flex-col items-center gap-1 text-emerald-400 font-bold transition";
        renderStandings();
      }
    }

    function openMatchDetails(id) {
      var match = null;
      var league = "";
      var allLeagues = [].concat(matchesDatabase.today, matchesDatabase.yesterday, matchesDatabase.tomorrow);
      for (var i = 0; i < allLeagues.length; i++) {
        var l = allLeagues[i];
        for (var j = 0; j < l.matches.length; j++) {
          if (l.matches[j].id === id) {
            match = l.matches[j];
            league = l.league;
            break;
          }
        }
        if (match) break;
      }

      if (!match) return;

      var modal = document.getElementById('match-modal');
      document.getElementById('modal-league-title').innerText = league;
      document.getElementById('modal-content').innerHTML = '<div class="text-center p-3 bg-slate-950 rounded-2xl border border-slate-800 mb-2">' +
        '<div class="flex justify-between items-center text-sm font-bold text-white mb-2">' +
          '<span>' + match.home + '</span>' +
          '<span class="text-emerald-400 font-mono text-base">' + match.score + '</span>' +
          '<span>' + match.away + '</span>' +
        '</div>' +
        '<span class="text-xs text-slate-400">' + match.time + '</span>' +
      '</div>' +
      '<div class="space-y-1.5 text-xs text-slate-300">' +
        '<div class="flex justify-between p-2 rounded-xl bg-slate-950/60 border border-slate-800">' +
          '<span class="text-slate-400">📺 القناة الناقلة:</span>' +
          '<span class="font-bold text-emerald-400">' + match.channel + '</span>' +
        '</div>' +
        '<div class="flex justify-between p-2 rounded-xl bg-slate-950/60 border border-slate-800">' +
          '<span class="text-slate-400">🎙️ المعلق:</span>' +
          '<span class="font-bold text-white">' + match.commentator + '</span>' +
        '</div>' +
      '</div>';
      modal.classList.remove('hidden');
    }

    function closeMatchModal() {
      document.getElementById('match-modal').classList.add('hidden');
    }

    function refreshMatches() {
      var icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');
      setTimeout(function() {
        if (icon) icon.classList.remove('animate-spin');
        renderMatches();
      }, 400);
    }

    var deferredPrompt;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    function installAppPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            var banner = document.getElementById('install-banner');
            if (banner) banner.classList.add('hidden');
          }
          deferredPrompt = null;
        });
      } else {
        alert("لتثبيت التطبيق على هاتفك:\n1. اضغط على خيارات المتصفح (⋮ الثلاث نقاط).\n2. اختر 'إضافة إلى الشاشة الرئيسية' (Add to Home screen).");
      }
    }

    // Exécution directe
    renderMatches();
  </script>
</body>
</html>
